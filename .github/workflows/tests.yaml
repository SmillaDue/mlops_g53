name: Unit Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-latest", "windows-latest", "macos-latest"]
        python-version: ["3.13"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      # Linux/macOS: write JSON key using bash
      - name: Write GCP credentials (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cat > "${RUNNER_TEMP}/gcp-key.json" <<'JSON'
          ${{ secrets.GCP_SA_KEY_JSON }}
          JSON
          echo "GOOGLE_APPLICATION_CREDENTIALS=${RUNNER_TEMP}/gcp-key.json" >> $GITHUB_ENV

      # Windows: write JSON key using PowerShell
      - name: Write GCP credentials (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $path = Join-Path $env:RUNNER_TEMP "gcp-key.json"
          @'
          ${{ secrets.GCP_SA_KEY_JSON }}
          '@ | Out-File -FilePath $path -Encoding utf8
          "GOOGLE_APPLICATION_CREDENTIALS=$path" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8


      - name: Install dependencies
        run: |
          uv sync --dev --locked
        
      - name: Retrieve data
        run: |
          uv run dvc pull

      - name: Run unit tests with coverage
        run: |
          uv run coverage run --data-file=.coverage -m pytest tests/unittests
          uv run coverage report --data-file=.coverage -m > reports/coveragereport.out

      - name: Run integration tests
        run: |
          uv run pytest tests/integrationtests