name: Unit Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-latest", "windows-latest", "macos-latest"]
        python-version: ["3.13"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: |
          uv sync --dev --locked
        
      - name: Retrieve data
        run: |
          uv run dvc pull

      - name: Run unit tests with coverage
        run: |
          uv run coverage run --data-file=.coverage -m pytest tests/unittests
          uv run coverage report --data-file=.coverage -m > reports/coveragereport.out

      - name: Run integration tests
        run: |
          uv run pytest tests/integrationtests