serviceAccount: vertex-train-brains-sa@mlops-g53.iam.gserviceaccount.com

baseOutputDirectory:
  outputUriPrefix: gs://mlops-brain-tumor/runs/brain-tumor

workerPoolSpecs:
  - machineSpec:
      machineType: n1-highmem-4
    replicaCount: 1
    containerSpec:
      imageUri: europe-west1-docker.pkg.dev/mlops-g53/mlops-g53-repo/train:edited
      args:
        - "wandb.enabled=false"
        - "max_steps=5"
        - "epochs=1"
      env:
        - name: PYTHONUNBUFFERED
          value: "1"
        - name: GCS_DATA_URI
          value: gs://mlops-brain-tumor/data/processed/v1
