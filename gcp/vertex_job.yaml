displayName: brain-tumor-train
jobSpec:
  serviceAccount: vertex-train-brains-sa@mlops-g53.iam.gserviceaccount.com
  baseOutputDirectory:
    outputUriPrefix: gs://mlops-brain-tumor/runs/brain-tumor
  workerPoolSpecs:
  - machineSpec:
      machineType: n1-standard-4
    replicaCount: 1
    containerSpec:
      imageUri: europe-west1-docker.pkg.dev/mlops-g53/mlops-g53-repo/train:latest
      env:
        - name: GCS_DATA_URI
          value: gs://mlops-brain-tumor/data/processed/v1

