serviceAccount: vertex-train-brains-sa@mlops-g53.iam.gserviceaccount.com

baseOutputDirectory:
  outputUriPrefix: gs://mlops-brain-tumor/runs/hyperparameter-sweep

workerPoolSpecs:
  - machineSpec:
      machineType: n1-standard-4
    replicaCount: 1
    containerSpec:
      imageUri: europe-west1-docker.pkg.dev/mlops-g53/mlops-g53-repo/wandb:latest
      command:
        - "uv"
        - "run"
        - "wandb"
        - "agent"
        - "brainy_mlops/smallcnn/fx2j4z7g"
        - "--count"
        - "3"
      env:
        - name: PYTHONUNBUFFERED
          value: "1"
        - name: GCS_DATA_URI
          value: gs://mlops-brain-tumor/data/processed/v1
        - name: WANDB_API_KEY
          valueFrom:
            secretKeyRef:
              name: WANDB_API_KEY
