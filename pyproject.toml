[build-system]
requires = ["uv_build>=0.9.22,<0.10.0"]
build-backend = "uv_build"

[project]
name = "mlops_project"
version = "0.0.1"
description = "A short description of the project."
authors = [
  { name = "group53", email = "your@email.com" },
]
license = { file = "LICENSE" }
keywords = ["machine learning", "MLOps"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
]
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "dvc>=3.66.1",
    "dvc-gs>=3.0.2",
    "evidently>=0.7.20",
    "fastapi==0.115.6",
    "google-api-python-client>=2.188.0",
    "google-cloud-storage>=3.8.0",
    "httpx>=0.28.1",
    "hydra-core>=1.3.2",
    "imutils>=0.5.4",
    "locust>=2.43.1",
    "loguru>=0.7.3",
    "markdown>=3.10",
    "matplotlib>=3.10.8",
    "monai>=1.5.1",
    "numpy>=2.4.0",
    "opencv-python>=4.11.0.86",
    "pandas>=3.0.0",
    "python-multipart>=0.0.21",
    "scikit-learn>=1.8.0",
    "snakeviz>=2.2.2",
<<<<<<< HEAD
    "torch>=2.6.0",
=======
    "torch==2.6.0",
>>>>>>> main
    "torchvision>=0.21.0",
    "typer==0.21.1",
    "uvicorn==0.34.0",
    "wandb>=0.23.1",
]

[dependency-groups]
dev = [
    "coverage==7.6.9",
    "invoke==2.2.0",
    "mkdocs==1.6.1",
    "mkdocs-material<9.5",
    "mkdocstrings[python]>=0.24,<0.26",
    "mkdocs-autorefs<0.5",
    "pre-commit==4.5.1",
    "pytest==8.3.4",
    "ruff==0.1.3",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu" }
]
torchvision = [
    { index = "pytorch-cpu" }
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 120
lint.select = ["I"]

[tool.coverage.run]
source = ["src"]
omit = [
    "tests/*",
    "*/__init__.py",
]
branch = true

[tool.coverage.report]
fail_under = 0
precision = 2
show_missing = true
skip_covered = false
